name: release-gate

env:
  NEUTRALITY_PATTERN: ${{ vars.NEUTRALITY_PATTERN }}

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install . pytest build
      - run: python tools/supply_chain_gate.py --self-test
      - run: python tools/supply_chain_gate.py
      - name: Record resolved Loomground revision
        run: python -m pip freeze | grep '^loomground-governance @'
      - run: python -m pytest -q
      - run: python tools/run_loomground_conformance.py
      - run: python tools/check_version_coherence.py
      - run: python tools/check_adapter_selection_neutrality.py
      - run: python tools/check_register.py
      - run: python -m build

  neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: prose and language surfaces are tool- and vendor-neutral
        run: |
          # dot-plugin directories are functional paths the tooling needs, not prose.
          [ -n "$NEUTRALITY_PATTERN" ] || { echo "NEUTRALITY_PATTERN repository variable is not set"; exit 1; }
          hits=$(grep -rniE "$NEUTRALITY_PATTERN" \
               README.md llms.txt CHANGELOG.md docs src skills \
               --exclude-dir=__pycache__ 2>/dev/null | grep -vE '\.[a-z]+-plugin/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "vendor/model/framework name found in a prose or language surface"; exit 1
          fi
          echo "prose and language surfaces are neutral"
