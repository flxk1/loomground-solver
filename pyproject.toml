[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-solver"
version = "0.6.0"
description = "Universal reasoning substrate: 5D dimensioned edges, defeasible reasoning contract, solver topology. No governance, no corpus — both injected through ports."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "Loomground Contributors" }]
# Abstract dependency only — a name and range, no URL — so the built
# distribution stays index-publishable. The concrete source is resolved at
# install time: requirements-dev.txt pins the git tag for development and CI;
# a release resolves the range from whichever index the ecosystem publishes to.
dependencies = ["loomground-governance>=0.8,<0.12", "loomground-deontic>=0.1,<0.2"]

[project.urls]
Repository = "https://github.com/flxk1/loomground-solver"
Issues = "https://github.com/flxk1/loomground-solver/issues"

[project.scripts]
loomground-solver = "loomground_solver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
