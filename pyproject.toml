[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-solver"
version = "0.6.1"
description = "Universal reasoning substrate: 5D dimensioned edges, defeasible reasoning contract, solver topology. No governance, no corpus — both injected through ports."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "Loomground Contributors" }]
# First-party siblings are direct git references, not ranges: no index serves this
# family. Each ref is the release tag loomground's RELEASES.json records, and the full
# transitive closure is declared, because those tagged commits still carry ranges that
# only these URLs can satisfy.
dependencies = [
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@loomground-governance-v0.11.1",
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@loomground-deontic-v0.2.1",
]

[project.urls]
Repository = "https://github.com/flxk1/loomground-solver"
Issues = "https://github.com/flxk1/loomground-solver/issues"

[project.scripts]
loomground-solver = "loomground_solver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
